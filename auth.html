<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login | PRVA Route Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-wrap{ min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy-900); }
  .auth-card{ background: var(--white); border-radius: var(--radius-lg); padding: 36px; width: 100%; max-width: 380px; box-shadow: var(--shadow-soft); }
  .auth-card h1{ font-size: 22px; margin-bottom: 6px; }
  .auth-card p{ color: var(--muted); font-size: 13px; margin-bottom: 24px; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Staff Login</h1>
    <p>Route DB staff accounts only -- no public signup.</p>
    <form id="authForm">
      <div class="rn-sb-field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" required>
      </div>
      <div class="rn-sb-field">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
      <div class="rn-sb-status" id="authStatus"></div>
    </form>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase-client.js";

  const form = document.getElementById("authForm");
  const status = document.getElementById("authStatus");

  if (!supabase) {
    status.textContent = "Supabase isn't connected yet.";
    status.className = "rn-sb-status error";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!supabase) return;
    status.textContent = "Logging in…";
    status.className = "rn-sb-status";
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      status.textContent = error.message;
      status.className = "rn-sb-status error";
      return;
    }
    window.location.href = "import.html";
  });
</script>
</body>
</html>
