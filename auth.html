<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login | PRVA Route Network</title>
<script>(function(){try{var t=localStorage.getItem("prva-routedb-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-wrap{ min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy-900); }
  .auth-card{ background: var(--surface); border-radius: var(--radius-lg); padding: 36px; width: 100%; max-width: 380px; box-shadow: var(--shadow-soft); }
  .auth-card h1{ font-size: 22px; margin-bottom: 6px; }
  .auth-card p{ color: var(--muted); font-size: 13px; margin-bottom: 24px; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Staff Login</h1>
    <p>Route DB staff accounts only -- no public signup.</p>
    <form id="authForm" novalidate>
      <div class="rn-sb-field">
        <label for="authEmail">Email</label>
        <input type="text" id="authEmail" autocomplete="email">
      </div>
      <div class="rn-sb-field">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
      <div class="rn-sb-status" id="authStatus"></div>
    </form>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase-client.js";

  const form = document.getElementById("authForm");
  const status = document.getElementById("authStatus");

  if (!supabase) {
    status.textContent = "Supabase isn't connected yet.";
    status.className = "rn-sb-status error";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    console.log("[auth] submit handler fired");
    if (!supabase) return;
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;
    if (!email || !password) {
      status.textContent = "Enter both your email and password.";
      status.className = "rn-sb-status error";
      return;
    }
    status.textContent = "Logging in…";
    status.className = "rn-sb-status";
    try {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        status.textContent = error.message;
        status.className = "rn-sb-status error";
        return;
      }
    } catch (err) {
      console.error("[auth] unexpected error", err);
      status.textContent = "Unexpected error: " + err.message;
      status.className = "rn-sb-status error";
      return;
    }
    window.location.href = "import.html";
  });
</script>
</body>
</html>
